<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Arena Proto — protótipo de combate</title>

<style>
  :root {
    --hp:      #ff4d5e;
    --hp-ghost:#ffffff;
    --ki:      #4fc3ff;
    --ki-full: #ffd24a;
    --warn:    #ff5a4d;
    --ink:     #e8eef8;
    --dim:     #8b97ab;
  }

  * { margin: 0; padding: 0; box-sizing: border-box; }

  html, body {
    height: 100%;
    overflow: hidden;
    background: #05070d;
    color: var(--ink);
    font-family: system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif;
    user-select: none;
  }

  #app { position: fixed; inset: 0; }
  canvas { display: block; cursor: crosshair; }

  /* ================= loading ================= */
  #loading {
    position: fixed; inset: 0; z-index: 100;
    display: flex; flex-direction: column;
    align-items: center; justify-content: center;
    gap: 18px;
    background: radial-gradient(ellipse at center, #141c2e 0%, #05070d 70%);
    transition: opacity .5s ease;
  }
  #loading.hidden { opacity: 0; pointer-events: none; }
  #loading h1 {
    font-size: 13px; letter-spacing: .42em; font-weight: 600;
    color: var(--dim); text-transform: uppercase;
  }
  .spinner {
    width: 42px; height: 42px; border-radius: 50%;
    border: 2px solid rgba(255,255,255,.08);
    border-top-color: var(--ki);
    animation: spin .8s linear infinite;
  }
  @keyframes spin { to { transform: rotate(360deg); } }
  #loading-msg { font-size: 13px; color: var(--dim); text-align: center; line-height: 1.6; }

  /* ================= HUD ================= */
  .hud { position: fixed; inset: 0; pointer-events: none; z-index: 10; }

  .hud-top {
    display: flex; align-items: flex-start; justify-content: space-between;
    gap: 24px; padding: 20px 26px;
  }

  .bar-block { width: min(33vw, 380px); }
  .bar-block.right { direction: rtl; }
  .bar-block.right .bar-fill,
  .bar-block.right .bar-ghost { float: right; }

  .bar-name {
    font-size: 11px; letter-spacing: .22em; font-weight: 700;
    color: var(--dim); margin-bottom: 7px; text-transform: uppercase;
  }

  .bar {
    position: relative; height: 13px; overflow: hidden;
    background: rgba(8,12,20,.72);
    border: 1px solid rgba(255,255,255,.10);
    border-radius: 2px;
    box-shadow: 0 2px 14px rgba(0,0,0,.5);
  }
  .bar.ki { height: 6px; margin-top: 5px; }

  .bar-fill, .bar-ghost {
    position: absolute; top: 0; bottom: 0; left: 0;
    width: 100%;
  }
  .bar-block.right .bar-fill,
  .bar-block.right .bar-ghost { left: auto; right: 0; }

  .bar.hp .bar-fill  { background: linear-gradient(180deg, #ff7a86, var(--hp)); transition: width .06s linear; }
  .bar.hp .bar-ghost { background: rgba(255,255,255,.34); }
  .bar.ki .bar-fill  { background: linear-gradient(180deg, #9ddfff, var(--ki)); transition: width .1s linear; }
  .bar.ki .bar-fill.full {
    background: linear-gradient(180deg, #ffe89a, var(--ki-full));
    box-shadow: 0 0 12px rgba(255,210,74,.7);
  }
  /* Ki abaixo de `ki.lowKiThreshold`: sem vanish, sem dash, sem escape.
     É informação de sobrevivência — tem que ser vista de canto de olho. */
  .bar.ki .bar-fill.low {
    background: linear-gradient(180deg, #ff9a9a, #d94a4a);
    animation: blink .62s steps(2) infinite;
  }

  .hud-center { text-align: center; flex: 1; padding-top: 2px; }
  .timer {
    font-size: 26px; font-weight: 700; letter-spacing: .06em;
    font-variant-numeric: tabular-nums;
    text-shadow: 0 2px 12px rgba(0,0,0,.8);
  }
  .arena-state {
    font-size: 10px; letter-spacing: .20em; color: var(--dim);
    margin-top: 4px; text-transform: uppercase;
  }
  .alive {
    font-size: 10px; letter-spacing: .20em; color: #ffd75c;
    margin-top: 3px; font-weight: 700;
  }
  .training {
    display: inline-block; margin-top: 5px;
    font-size: 10px; letter-spacing: .18em; font-weight: 700;
    color: #0a0e16; background: #7fe08a;
    padding: 2px 9px; border-radius: 3px;
  }
  .arena-state.warn   { color: var(--warn); animation: blink .5s steps(2) infinite; }
  .arena-state.shrink { color: #ffb347; }
  @keyframes blink { 50% { opacity: .25; } }

  /* combo */
  .combo {
    position: fixed; left: 50%; top: 27%;
    transform: translateX(-50%);
    font-size: 40px; font-weight: 800; font-style: italic;
    letter-spacing: .02em; opacity: 0;
    color: #fff;
    text-shadow: 0 0 22px rgba(120,200,255,.9), 0 4px 16px rgba(0,0,0,.9);
  }
  .combo.show { opacity: 1; animation: comboPop .28s cubic-bezier(.2,1.6,.4,1); }
  @keyframes comboPop {
    0%   { transform: translateX(-50%) scale(1.5); opacity: 0; }
    40%  { transform: translateX(-50%) scale(.94); opacity: 1; }
    100% { transform: translateX(-50%) scale(1);   opacity: 1; }
  }

  /* banner */
  .banner {
    position: fixed; left: 50%; top: 42%;
    transform: translate(-50%,-50%) scale(.9);
    font-size: 30px; font-weight: 800; letter-spacing: .10em;
    text-transform: uppercase; opacity: 0;
    transition: opacity .2s, transform .2s;
    text-shadow: 0 0 26px rgba(0,0,0,.95), 0 4px 18px rgba(0,0,0,.9);
    text-align: center;
  }
  .banner.show { opacity: 1; transform: translate(-50%,-50%) scale(1); }
  .banner.big  { font-size: 46px; color: #fff; }
  .banner.warn { color: var(--warn); }

  /* vinheta de perigo na borda */
  .edge-warn {
    position: fixed; inset: 0; opacity: 0;
    transition: opacity .15s linear;
    background: radial-gradient(ellipse at center,
      rgba(255,40,40,0) 42%, rgba(255,40,40,.65) 100%);
  }

  /* ---- lock-on ---- */
  .lock-reticle {
    position: fixed; left: 0; top: 0;
    width: 62px; height: 62px;
    opacity: 0; transition: opacity .12s linear;
    will-change: transform;
  }
  .lock-reticle span {
    position: absolute; width: 13px; height: 13px;
    border: 2px solid rgba(120, 220, 255, .92);
    filter: drop-shadow(0 0 5px rgba(80,200,255,.85));
  }
  /* quatro cantos, cada um só com duas bordas */
  .lock-reticle span:nth-child(1) { left: 0;  top: 0;    border-right: none; border-bottom: none; }
  .lock-reticle span:nth-child(2) { right: 0; top: 0;    border-left: none;  border-bottom: none; }
  .lock-reticle span:nth-child(3) { left: 0;  bottom: 0; border-right: none; border-top: none; }
  .lock-reticle span:nth-child(4) { right: 0; bottom: 0; border-left: none;  border-top: none; }

  .lock-state {
    position: fixed; left: 50%; bottom: 76px;
    transform: translateX(-50%);
    font-size: 10px; letter-spacing: .22em; font-weight: 700;
    color: rgba(120, 220, 255, .78);
    text-shadow: 0 2px 10px rgba(0,0,0,.9);
  }
  .lock-state.free { color: rgba(255, 190, 90, .85); }

  /* ---- botão do painel de tuning ---- */
  .dbg-toggle {
    position: fixed; top: 96px; right: 18px; z-index: 51;
    display: flex; align-items: center; gap: 7px;
    padding: 8px 13px; cursor: pointer;
    font-family: inherit; font-size: 10.5px; font-weight: 700;
    letter-spacing: .14em; color: #cfe0f5;
    background: rgba(10,14,22,.82);
    border: 1px solid rgba(255,255,255,.15);
    border-radius: 5px;
    backdrop-filter: blur(8px);
    transition: background .15s, border-color .15s, transform .15s;
  }
  .dbg-toggle:hover { background: rgba(79,195,255,.22); border-color: var(--ki); }
  .dbg-toggle.active { background: rgba(79,195,255,.3); border-color: var(--ki); }
  .dbg-toggle span { font-size: 13px; }
  .dbg-toggle kbd {
    font-family: ui-monospace, Menlo, monospace; font-size: 9px;
    background: rgba(255,255,255,.1); border: 1px solid rgba(255,255,255,.16);
    border-radius: 3px; padding: 1px 4px;
  }
  /* Sai da frente quando o painel abre, senão fica por cima dele. */
  .debug-panel.open ~ .dbg-toggle,
  .dbg-toggle.active { right: 356px; }

  /* rodapé */
  .hud-bottom {
    position: fixed; left: 0; right: 0; bottom: 0;
    display: flex; align-items: flex-end; justify-content: space-between;
    padding: 18px 26px; gap: 20px;
  }

  .help {
    display: grid; grid-template-columns: auto auto; gap: 3px 12px;
    font-size: 10.5px; color: var(--dim); opacity: .62; line-height: 1.5;
  }
  .help > div { display: contents; }
  .help kbd {
    font-family: ui-monospace, 'SF Mono', Menlo, monospace;
    font-size: 10px; color: #cfe0f5;
    background: rgba(255,255,255,.07);
    border: 1px solid rgba(255,255,255,.12);
    border-radius: 3px; padding: 1px 6px;
    white-space: nowrap;
    justify-self: start;   /* sem isto o grid estica cada tecla até a coluna toda */
  }
  .help span { align-self: center; }

  .stats {
    display: flex; gap: 14px; font-size: 10.5px;
    font-family: ui-monospace, 'SF Mono', Menlo, monospace;
    color: var(--dim); opacity: .5;
    font-variant-numeric: tabular-nums;
  }

  /* ================= telemetria (tecla H) =================
     Instrumento, não interface: fica no canto, em monoespaçada, e só aparece
     quando pedido. O §23 avisa — não transformar o jogo num Excel voador. */
  .telemetry {
    position: fixed; left: 26px; top: 96px; z-index: 30;
    font-family: ui-monospace, 'SF Mono', Menlo, monospace;
    font-size: 11px; line-height: 1.45;
    white-space: pre;
    color: #cfe6ff;
    background: rgba(8,12,20,.72);
    border: 1px solid rgba(255,255,255,.10);
    border-left: 2px solid #59d2ff;
    border-radius: 4px;
    padding: 9px 13px;
    font-variant-numeric: tabular-nums;
    text-shadow: 0 1px 3px rgba(0,0,0,.9);
    pointer-events: none;
  }

  /* ================= painel de debug ================= */
  .debug-panel {
    position: fixed; top: 0; right: 0; bottom: 0; z-index: 50;
    width: 340px; max-width: 92vw;
    background: rgba(10,14,22,.95);
    backdrop-filter: blur(12px);
    border-left: 1px solid rgba(255,255,255,.10);
    display: flex; flex-direction: column;
    transform: translateX(100%);
    transition: transform .22s cubic-bezier(.4,0,.2,1);
    pointer-events: auto;
  }
  .debug-panel.open { transform: translateX(0); }

  .dbg-head {
    padding: 16px 18px 12px;
    border-bottom: 1px solid rgba(255,255,255,.08);
    display: flex; flex-direction: column; gap: 3px;
  }
  .dbg-head strong { font-size: 11px; letter-spacing: .20em; }
  .dbg-hint { font-size: 10px; color: var(--dim); }

  .dbg-body { flex: 1; overflow-y: auto; padding: 8px 16px 16px; }
  .dbg-body::-webkit-scrollbar { width: 8px; }
  .dbg-body::-webkit-scrollbar-thumb { background: rgba(255,255,255,.12); border-radius: 4px; }

  .dbg-group {
    font-size: 9.5px; letter-spacing: .18em; text-transform: uppercase;
    color: var(--ki); margin: 18px 0 8px; padding-bottom: 5px;
    border-bottom: 1px solid rgba(79,195,255,.18);
  }
  .dbg-group:first-child { margin-top: 6px; }

  .dbg-row {
    display: grid; grid-template-columns: 1fr auto; gap: 2px 8px;
    align-items: center; margin-bottom: 10px;
  }
  .dbg-row label { font-size: 11px; color: #c3cee0; }
  .dbg-val {
    font-family: ui-monospace, Menlo, monospace; font-size: 11px;
    color: var(--dim); font-variant-numeric: tabular-nums;
  }
  .dbg-row.changed label { color: var(--ki-full); }
  .dbg-row.changed .dbg-val { color: var(--ki-full); font-weight: 700; }

  .dbg-row input[type=range] {
    grid-column: 1 / -1; width: 100%; height: 3px;
    -webkit-appearance: none; appearance: none;
    background: rgba(255,255,255,.14); border-radius: 2px; outline: none;
  }
  .dbg-row input[type=range]::-webkit-slider-thumb {
    -webkit-appearance: none; width: 13px; height: 13px;
    border-radius: 50%; background: var(--ki); cursor: pointer;
    box-shadow: 0 0 0 3px rgba(79,195,255,.18);
  }
  .dbg-row input[type=range]::-moz-range-thumb {
    width: 13px; height: 13px; border: none;
    border-radius: 50%; background: var(--ki); cursor: pointer;
  }

  .dbg-foot {
    padding: 12px 16px; display: flex; gap: 8px;
    border-top: 1px solid rgba(255,255,255,.08);
  }
  .dbg-foot button {
    flex: 1; padding: 9px 10px; font-size: 10.5px; font-weight: 600;
    letter-spacing: .04em; cursor: pointer;
    color: var(--ink); background: rgba(255,255,255,.07);
    border: 1px solid rgba(255,255,255,.14); border-radius: 4px;
    font-family: inherit;
  }
  .dbg-foot button:hover { background: rgba(79,195,255,.18); border-color: var(--ki); }
</style>
</head>

<body>
  <div id="app"></div>

  <div id="loading">
    <div class="spinner"></div>
    <h1>Arena Proto</h1>
    <div id="loading-msg">iniciando…</div>
  </div>

  <script type="importmap">
  {
    "imports": {
      "three": "./vendor/three.module.js",
      "three/addons/": "./vendor/jsm/"
    }
  }
  </script>

  <script type="module" src="./src/main.js"></script>
</body>
</html>
